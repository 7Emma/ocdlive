# ==============================================================================
# OCD LIVE — CONFIGURATION NETLIFY PRODUCTION (Next.js App Router)
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.18.0"
  NPM_FLAGS = "--legacy-peer-deps"

# Active le runtime Next.js v5 pour App Router, Server Actions & Routes dynamiques
[[plugins]]
  package = "@netlify/plugin-nextjs"

# En-têtes HTTP de sécurité et mise en cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
